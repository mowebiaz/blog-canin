
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5
  
    ignore:
      # Node types must match the Node version used in production (24.x)
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint"
        update-types: 
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
